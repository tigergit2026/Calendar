<style>

:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --line:#e4e7ec;
  --line-soft:#eef1f5;
  --text:#1a1f26;
  --muted:#6b7480;
  --faint:#9aa3af;
  --accent:#0f62fe;
  --accent-soft:#eaf1ff;
  --green:#0f8a4f;
  --green-soft:#e7f6ee;
  --amber:#b45309;
  --amber-soft:#fdf1e0;
  --red:#c0392b;
  --red-soft:#fdeceb;
  --violet:#6d28d9;
  --violet-soft:#f1ebfd;
  --slate:#475569;
  --slate-soft:#eef1f5;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 72px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.2px}
.top .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.stamp{font-size:12px;color:var(--faint);text-align:right;line-height:1.7}
.stamp b{color:var(--muted);font-weight:600}

/* ---------- section ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:15px;font-weight:640}
.sec-h .tag{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:#fff}
.sec-h .line{flex:1;height:1px;background:var(--line)}

/* ---------- row 1: Beijing ---------- */
.beijing{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.bj-left{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.bj-time{font-size:52px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.bj-time .sec{font-size:24px;color:var(--faint);margin-left:2px}
.bj-date .d{font-size:19px;font-weight:600}
.bj-date .m{font-size:13px;color:var(--muted);margin-top:3px}
.bj-right{display:flex;gap:26px;flex-wrap:wrap}
.kv{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:17px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

/* ---------- search ---------- */
.searchbar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.sb-field{position:relative;flex:1;min-width:240px}
.sb-field input{
  font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);width:100%;
}
.sb-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sb-drop{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 28px rgba(16,24,40,.12);max-height:290px;overflow-y:auto;
}
.sb-item{padding:9px 12px;display:flex;align-items:baseline;gap:8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-soft)}
.sb-item:last-child{border-bottom:none}
.sb-item:hover,.sb-item.act{background:var(--accent-soft)}
.sb-item b{font-weight:680}
.sb-item i{font-style:normal;color:var(--muted);font-size:12.5px}
.sb-item s{text-decoration:none;color:var(--faint);font-size:11px;margin-left:auto}
.sb-msg{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- school cards ---------- */
.schools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.schools.single{grid-template-columns:1fr;max-width:820px;margin:0 auto}
.sc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.03);display:flex;flex-direction:column;
}
.sc-bar{height:3px;background:var(--c,#0f62fe)}
.sc-body{padding:15px 17px 16px;flex:1;display:flex;flex-direction:column}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sc-code{font-size:22.5px;font-weight:680;letter-spacing:.3px;line-height:1.15}
.sc-zh{font-size:18px;color:var(--muted);margin-top:2px}
.sc-city{font-size:11.5px;color:var(--faint);margin-top:4px;letter-spacing:.2px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-teaching{background:var(--green-soft);color:var(--green)}
.p-break{background:var(--amber-soft);color:var(--amber)}
.p-exam{background:var(--red-soft);color:var(--red)}
.p-study{background:var(--violet-soft);color:var(--violet)}
.p-rest{background:var(--slate-soft);color:var(--slate)}

.sc-main{display:flex;align-items:flex-end;gap:9px;margin:12px 0 2px}
.sc-week{font-size:28px;font-weight:700;line-height:1;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.sc-week small{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:4px}
.sc-of{font-size:11.5px;font-weight:600;color:var(--faint);padding-bottom:4px}
.sc-tz{
  margin-left:auto;align-self:flex-end;margin-bottom:4px;white-space:nowrap;
  font-size:11px;font-weight:640;color:var(--slate);background:var(--line-soft);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;
}
.sc-tz b{font-weight:700;color:var(--accent)}
.sc-term{font-size:11.5px;color:var(--muted);margin-top:2px}
.sc-note{font-size:12px;margin-top:8px;padding:6px 9px;border-radius:8px;background:var(--line-soft);color:var(--slate);line-height:1.5}

.bar{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:13px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--c,#0f62fe)}

.meta{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.meta div{font-size:11.5px;color:var(--muted)}
.meta div span{color:var(--text);font-weight:560}
.meta .kd em{font-style:normal;font-size:10.5px;color:var(--faint);margin-left:2px}
.meta .kd em.now{color:var(--amber);font-weight:700}

/* ---------- 学期时间汇总表 ---------- */
.sc-sum{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sc-sum-h{font-size:12.5px;font-weight:680;text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);color:var(--text);letter-spacing:.3px}
.sc-sum table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.sc-sum td{border-top:1px solid var(--line-soft);padding:3.5px 6px;text-align:center;color:var(--slate);line-height:1.4}
.sc-sum tr:first-child td{border-top:none}
.sc-sum .sg{width:27%;background:#f9e4e2;color:#93413a;font-weight:640}
.sc-sum .sw{width:31%;font-weight:620;color:var(--text)}
.sc-sum tr.r-break td{background:#fdf4da}
.sc-sum tr.r-break .sw{color:#8a6116}
.sc-sum tr.r-study td{background:var(--violet-soft)}
.sc-sum tr.r-exam td{background:var(--green-soft)}
.sc-sum tr.r-extra td{background:#fbfcfd}
.sc-sum tr.r-extra .sg{background:transparent;color:var(--muted)}
.sc-sum tr.r-extra .sw{color:var(--slate);font-weight:700}
.sc-sum .cnt{font-style:normal;font-size:10px;color:var(--faint);margin-left:4px}
.sc-sum .cnt.now{color:var(--amber);font-weight:700}
.sc-sum tr.cur td{box-shadow:inset 0 0 0 2px #0f62fe;font-weight:700}
.sc-sum tr.cur .sg{box-shadow:none}
.sc-foot{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sc-foot a{font-size:11px;color:var(--faint);text-decoration:none}
.sc-foot a:hover{color:var(--accent)}
.ref{font-size:10px;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 6px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--faint);background:#fbfcfd;font-size:13px}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:13px;font-weight:560;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;
}

.btn.ghost{background:#fff;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:#cbd2dc}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.8}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}

<script>
/* ============================================================
   1. 日期工具（全部按 UTC 日历日计算，规避夏令时）
   ============================================================ */
const DAY = 86400000;
function D(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }
function addDays(dt,n){ return new Date(dt.getTime()+n*DAY); }
function mondayOf(dt){ const dow=dt.getUTCDay(); return addDays(dt, -((dow+6)%7)); }
function diffDays(a,b){ return Math.round((D(b)-D(a))/DAY); }
function fmtMD(s){ const d=D(s); return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`; }
function fmtMDshort(s){ const d=D(s); return `${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`; }

function todayIn(tz){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'})
            .formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function tzOffsetMinutes(tz, when){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(when);
  const g=t=>p.find(x=>x.type===t).value;
  const asUTC = Date.UTC(+g('year'), +g('month')-1, +g('day'), +g('hour'), +g('minute'), +g('second'));
  return Math.round((asUTC - Math.floor(when.getTime()/1000)*1000)/60000);
}
/* 澳洲 + 英国全部时区缩写 */
const TZABBR = {
  'Australia/Sydney':{600:'AEST',660:'AEDT'},
  'Australia/Melbourne':{600:'AEST',660:'AEDT'},
  'Australia/Canberra':{600:'AEST',660:'AEDT'},
  'Australia/Hobart':{600:'AEST',660:'AEDT'},
  'Australia/Brisbane':{600:'AEST'},
  'Australia/Adelaide':{570:'ACST',630:'ACDT'},
  'Australia/Darwin':{570:'ACST'},
  'Australia/Perth':{480:'AWST',540:'AWDT'},
  'Europe/London':{0:'GMT',60:'BST'},
  'Asia/Shanghai':{480:'CST'}
};
function tzAbbr(tz, when){
  const off = tzOffsetMinutes(tz, when);
  const m = TZABBR[tz];
  if (m && m[off]) return m[off];
  const sign = off<0?'-':'+';
  const a = Math.abs(off), h = Math.floor(a/60), mm = a%60;
  return `UTC${sign}${h}${mm?':'+String(mm).padStart(2,'0'):''}`;
}
function fmtOff(mins){
  const sign = mins<0?'-':'+';
  const a=Math.abs(mins), h=Math.floor(a/60), mm=a%60;
  return `${sign}${h}${mm?':'+String(mm).padStart(2,'0'):''}h`;
}

function normBreaks(p){
  // 休息周一律不计入教学周，也不占教学周编号（澳洲的 flexi week、英国的 Reading Week 同理）
  return (p.breaks||[]).map(b=>({
    s:D(b[0]), e:D(b[1]), label:b[2]||'假期', numbered: !!b[3]
  }));
}

    'Non-teaching period':'非教学周',
    'Student vacation':'学生假期','Intra-trimester break':'学期内假期',
    'Tuition-free week':'免课周','Study break':'无课周','Study vacation':'无课周',
    'Lecture recess':'停课周','Class free week':'无课周'
  };
  return map[label] || label;
}
function breakOnWeek(br, mon, sun){
  let cnt=0;
  for(let d=new Date(mon); d<=sun; d=addDays(d,1)){
    const dow=d.getUTCDay();
    if(dow>=1 && dow<=5 && d>=br.s && d<=br.e) cnt++;
  }
  return cnt>=3;
}
/* 周循环的终点：优先 termEnd（教学结束后的假期周也要进表），否则 teachEnd */
function rangeEndOf(p){ return p.termEnd || p.teachEnd; }
function buildWeeks(p){
  const brs = normBreaks(p);
  const endStr = rangeEndOf(p);
  const last = endStr ? D(endStr) : null;
  const out=[]; let m = mondayOf(D(p.start)); let i=0; let pos=0; let guard=0;
  while(guard++ < 80){
    const sun = addDays(m,6);
    if(last && m>last) break;
    pos++;                                       // 学期内第几周（含休息周）
    const hit = brs.find(b=>breakOnWeek(b,m,sun));
    if(hit){                                     // 休息周：不计入教学周
      out.push({index:null, pos, mon:m, sun, isBreak:true, label:hit.label});
    } else {
      i++; out.push({index:i, pos, mon:m, sun});  // index = 第几教学周（休息周不占号）
    }
    m = addDays(m,7);
  }
  return out;
}
/* 该学期官方是否把休息周也编入周次（如 UNSW 的 flexi week 官方仍叫 Week 6） */
function numberedRest(p){ return normBreaks(p).some(b=>b.numbered); }
/* 教学周在教学期内显示的周次：按各校官方习惯 */
function weekNo(p, w){
  if(!w || w.isBreak) return null;
  return numberedRest(p) ? w.pos : w.index;
}
/* 实际教学周总数（休息周不计入） */
function teachTotal(p){ return buildWeeks(p).filter(w=>!w.isBreak).length; }
function evaluate(school, today){
  const ps = school.periods.slice().sort((a,b)=>a.start.localeCompare(b.start));
  for(const p of ps){
    const rEnd = rangeEndOf(p);
    const end = p.examEnd || p.studyEnd || rEnd;
    if(today > end) continue;
    const oStart = p.oStart || null;
    if(oStart && today < oStart) return {kind:'before', p};
    if(oStart && today >= oStart && today < p.start) return {kind:'orientation', p};
    if(today < p.start) return {kind:'before', p};
    if(today > rEnd){
      if(p.studyStart && today >= p.studyStart && today <= (p.studyEnd||p.studyStart)) return {kind:'study', p};
      if(p.examStart && today >= p.examStart && today <= (p.examEnd||p.examStart)) return {kind:'exam', p};
      return {kind:'after', p};
    }
    const weeks = buildWeeks(p);
    const w = weeks.find(x=> today>=iso(x.mon) && today<=iso(x.sun));
    if(w) return {kind: w.isBreak ? 'break' : 'teaching', p, w, weeks};
    return {kind:'holiday', p};
  }
  // 所有已收录学期都已结束（学年末暑假）
  if(SITE.yearEndFallback){
    const lastP = ps[ps.length-1];
    if(lastP){
      const lastEnd = lastP.examEnd || lastP.studyEnd || rangeEndOf(lastP);
      if(today > lastEnd) return {kind:'after', p:lastP};
    }
  }
  return {kind:'nodata'};
}
function nextPeriod(school, today){
  return school.periods.slice().sort((a,b)=>a.start.localeCompare(b.start))
    .find(p => (p.oStart||p.start) > today);
}

/* ============================================================
   5. 渲染
   ============================================================ */
function allSchools(){ return SITE.schools; }

/* ---------- 搜索 / 单独显示 ---------- */
let focusKey = null;
let dropIdx = -1;

function keyOf(s){ return s.code; }
function findSchool(key){ return allSchools().find(s=>keyOf(s)===key); }
function matchSchools(q){
  const t=(q||'').trim().toLowerCase();
  if(!t) return [];
  const score = s=>{
    const code=(s.code||'').toLowerCase(), zh=(s.zh||'').toLowerCase();
    const city=(s.city||'').toLowerCase(), tz=(s.tz||'').toLowerCase();
    const al=(s.alias||[]).join('|').toLowerCase();
    if(code===t || zh===t) return 0;
    if(al.split('|').includes(t)) return 0;
    if(code.startsWith(t)) return 1;
    if(zh.includes(t)) return 2;
    if(city.includes(t) || tz.includes(t) || al.includes(t)
       || (t.length>=2 && SITE.countryAlias.some(k=>k.includes(t)))) return 3;
    return code.includes(t) ? 4 : 9;
  };
  return allSchools().map(s=>({s,n:score(s)}))
    .filter(x=>x.n<9)
    .sort((a,b)=>a.n-b.n || String(a.s.code).localeCompare(String(b.s.code)))
    .map(x=>x.s).slice(0,8);
}
function renderDrop(){
  const drop=document.getElementById('sbDrop');
  const ms=matchSchools(document.getElementById('qSchool').value);
  if(!ms.length){ drop.hidden=true; drop.innerHTML=''; dropIdx=-1; return; }
  drop.innerHTML = ms.map((s,i)=>
    `<div class="sb-item${i===dropIdx?' act':''}" data-key="${keyOf(s)}"><b>${s.code}</b><i>${s.zh||''}</i><s>${s.city ? SITE.country + '·' + s.city : ''}</s></div>`
  ).join('');
  drop.hidden=false;
  drop.querySelectorAll('.sb-item').forEach(el=>{
    el.onmousedown = ev=>{ ev.preventDefault(); selectSchool(el.dataset.key); };
  });
}
function selectSchool(key){
  const s=findSchool(key), msg=document.getElementById('sbMsg');
  if(!s){ msg.style.color='var(--red)'; msg.textContent='未找到该学校，请从下拉列表中选择。'; return; }
  focusKey=key;
  try{ localStorage.setItem(SITE.lsKey,key); }catch(e){}
  document.getElementById('qSchool').value = s.code + (s.zh?' '+s.zh:'');
  document.getElementById('sbDrop').hidden=true;
  document.getElementById('sbTag').textContent = `单独显示 ${s.code}`;
  msg.style.color='var(--muted)';
  msg.textContent = `已单独显示 ${s.code}${s.zh?'（'+s.zh+'）':''} 的校历信息；点「显示全部」可恢复。`;
  renderSchools();
  document.getElementById('schools').scrollIntoView({behavior:'smooth',block:'start'});
}
function clearFocus(){
  focusKey=null;
  try{ localStorage.removeItem(SITE.lsKey); }catch(e){}
  document.getElementById('qSchool').value='';
  document.getElementById('sbDrop').hidden=true;
  document.getElementById('sbTag').textContent='输入简称 / 中文名 / 城市 / 国家';
  const msg=document.getElementById('sbMsg');
  msg.style.color='var(--muted)';
  msg.textContent='已恢复显示全部学校。';
  renderSchools();
}

/* ---------- 与北京时间的时差 ---------- */
const BJ_OFFSET = 480;
function tzLabel(mins){
  if(mins===0) return '与北京时间同时';
  const sign = mins>0?'+':'-';
  const a=Math.abs(mins), h=Math.floor(a/60), m=a%60;
  return `北京时间 <b>${sign}${h}${m?':'+String(m).padStart(2,'0'):''}H</b>`;
}
function tzDiffNow(tz){
  try{ return tzOffsetMinutes(tz, new Date()) - BJ_OFFSET; }catch(e){ return 0; }
}

function statusPill(kind){
  const map = {
    teaching:['p-teaching','教学中'],
    break:['p-break','假期中'],
    study:['p-study','复习周'],
    exam:['p-exam','考试期'],
    orientation:['p-study','迎新周'],
    before:['p-rest','假期中'],
    after:['p-rest','已结课'],
    holiday:['p-rest','假期中'],
    nodata:['p-rest','无数据']
  };
  return map[kind] || map.nodata;
}

/* ---------- 学期时间汇总表 ---------- */
function fmtDot(s){ const d=D(s); return `${d.getUTCMonth()+1}.${d.getUTCDate()}`; }
function termShort(name){
  let s = String(name);
  if(SITE.summerAlias) s = s.replace('Summer Term (U1)','Summer').replace('Summer Term','Summer');
  return s
    .replace(/Semester\s*/g,'S')
    .replace(/Trimester\s*/g,'T')
    .replace(/Term\s*(?=[\dU])/g,'T')
    .replace(/\s*Session\s*/g,'')
    .trim();
}
function termTitle(name){
  const s = termShort(name);
  return (SITE.termSuffixAlways || /^(S|T)\d/.test(s)) ? s+'学期' : s;
}
function summaryTable(s, p, today){
  if(!p || !p.start || !p.teachEnd) return '';
  const rows = [];
  const push=(g,w,d,rs,re,cls)=>rows.push({g,w,d,cls:cls||'',cur: !!rs && today>=rs && today<=re});
  if(p.oStart) push('迎新周','W0',`${fmtDot(p.oStart)}~${fmtDot(p.oEnd||p.start)}`, p.oStart, p.oEnd||p.start,'r-ori');
  let wn=0;
  const nrest = numberedRest(p);
  for(const w of buildWeeks(p)){
    const d = `${fmtDot(iso(w.mon))}~${fmtDot(iso(addDays(w.mon,4)))}`;
    if(w.isBreak){
      // 休息周：不计入教学周 —— 单独成组、不占教学周编号，只显示假期名称
      push('休息周', brLabel(w.label), d, iso(w.mon), iso(w.sun),'r-break');
      if(nrest) wn = w.pos;          // 官方仍把该周编入周次时，后续周次顺延
    } else {
      wn = nrest ? w.pos : w.index;  // index = 实际第几教学周（休息周不占号）
      push('教学周',`W${wn}`, d, iso(w.mon), iso(w.sun),'');
    }
  }
  if(p.studyStart){ wn++; push('复习周',`W${wn}`,`${fmtDot(p.studyStart)}-${fmtDot(p.studyEnd||p.studyStart)}`, p.studyStart, p.studyEnd||p.studyStart,'r-study'); }
  if(p.examStart){ wn++; push('考试周',`W${wn}`,`${fmtDot(p.examStart)}-${fmtDot(p.examEnd||p.examStart)}`, p.examStart, p.examEnd||p.examStart,'r-exam'); }
  for(const ex of (p.extras||[])){
    let cnt='';
    if(ex[2]){
      const d = diffDays(today, ex[2]);
      cnt = `<em class="cnt${(d>=0&&d<=14)?' now':''}">${d>0?`剩 ${d} 天`:d===0?'今天':`已过 ${-d} 天`}</em>`;
    }
    rows.push({g:ex[0], w:'', d:(ex[1]||'')+cnt, cls:'r-extra', cur:false});
  }

  let html = `<div class="sc-sum"><div class="sc-sum-h">${s.code} ${p.start.slice(0,4)}年 ${termTitle(p.name)}</div><table>`;
  rows.forEach((r,idx)=>{
    const startRun = idx===0 || rows[idx-1].g!==r.g;
    let span=1;
    if(startRun){ while(idx+span<rows.length && rows[idx+span].g===r.g) span++; }
    html += `<tr class="${r.cls}${r.cur?' cur':''}">`;
    if(startRun) html += `<td class="sg"${span>1?` rowspan="${span}"`:''}>${r.g}</td>`;
    html += `<td class="sw">${r.w}</td><td class="sd">${r.d}</td></tr>`;
  });
  html += `</table></div>`;
  return html;
}

/* ---------- 关键日期（退课截止 / 成绩公布） ---------- */
function keyDateCells(p, today){
  const out=[];
  for(const ex of (p.extras||[])){
    const label = /退课|撤课|withdraw|drop/i.test(ex[0]) ? '退课截止'
                : (/成绩|出分|result/i.test(ex[0]) ? '成绩公布' : ex[0]);
    const val = ex[2] ? fmtMD(ex[2]) : (ex[1]||'');
    let cnt='';
    if(ex[2]){
      const d = diffDays(today, ex[2]);
      cnt = d>0?`剩 ${d} 天`:d===0?'今天':'已过';
    }
    out.push(`<div class="kd">${label} <span>${val}</span>${cnt?` <em class="${cnt==='今天'?'now':''}">${cnt}</em>`:''}</div>`);
  }
  return out.slice(0,2).join('');
}

function renderSchools(){
  const host = document.getElementById('schools');
  const all = allSchools();
  const focused = focusKey ? all.find(s=>keyOf(s)===focusKey) : null;
  const list = focused ? [focused] : all;
  host.classList.toggle('single', !!focused);
  document.getElementById('schTag').textContent = focused ? `单独显示 ${focused.code}` : `${list.length} 所学校`;
  if(!list.length){
    host.innerHTML = `<div class="empty">${SITE.emptyMsg}</div>`;
    return;
  }
  host.innerHTML = list.map(s=>{
    const today = todayIn(s.tz);
    const r = evaluate(s, today);
    const [cls, label] = statusPill(r.kind);
    const ref = r.p && r.p.provisional ? `<span class="ref">参考</span>` : '';

    let main = '', note = '', pct = 0, metaA = '', metaB = '';
    if(r.kind==='teaching'){
      const total = r.weeks.filter(w=>!w.isBreak).length;   // 休息周不计入教学周
      const seq = r.w.index;                                // 实际第几教学周
      const n = weekNo(r.p, r.w);                           // 按各校官方习惯显示的周次
      pct = Math.round(seq/total*100);
      main = `<div class="sc-week">Week ${n}</div><div class="sc-of">/ ${total} 周</div>`;
      const leftWeeks = total - seq;
      const daysToEnd = diffDays(today, r.p.teachEnd);
      metaA = `<div>本周 <span>${fmtMDshort(iso(r.w.mon))} – ${fmtMDshort(iso(r.w.sun))}</span></div>`;
      metaB = `<div>教学结束 <span>${fmtMD(r.p.teachEnd)}</span></div>`;
      const bits = [];
      if(n !== seq) bits.push(`休息周不计入教学周，本周为实际第 ${seq} / ${total} 教学周`);
      bits.push(`剩余 ${leftWeeks} 周教学（含本周），距教学结束 ${daysToEnd} 天`);
      if(r.p.examStart && r.p.examStart > r.p.teachEnd) bits.push(`考试 ${fmtMD(r.p.examStart)} 起`);
      note = `<div class="sc-note">${bits.join(' · ')}</div>`;
    } else if(r.kind==='break'){
      const ws = r.weeks || buildWeeks(r.p);
      const after = ws.find(x=>iso(x.mon)>iso(r.w.sun) && !x.isBreak);
      const resume = after ? iso(after.mon) : null;
      const total = ws.filter(w=>!w.isBreak).length;
      const done = ws.filter(w=>!w.isBreak && iso(w.sun) < iso(r.w.mon)).length;
      pct = total?Math.round(done/total*100):0;
      main = `<div class="sc-week" style="font-size:20px;padding-bottom:3px">${brLabel(r.w.label)}</div>`;
      metaA = `<div>区间 <span>${fmtMDshort(iso(r.w.mon))} – ${fmtMDshort(iso(r.w.sun))}</span></div>`;
      metaB = resume ? `<div>复课 <span>${fmtMD(resume)}</span></div>` : `<div>教学结束 <span>${fmtMD(r.p.teachEnd)}</span></div>`;
      note = `<div class="sc-note">休息周不计入教学周 · 已完成 ${done} / ${total} 周教学 · 假期剩余 ${diffDays(today, iso(r.w.sun))+1} 天</div>`;
    } else if(r.kind==='study'){
      main = `<div class="sc-week" style="font-size:20px;padding-bottom:3px">复习周</div>`;
      metaA = `<div>区间 <span>${fmtMDshort(r.p.studyStart)} – ${fmtMDshort(r.p.studyEnd)}</span></div>`;
      metaB = r.p.examStart ? `<div>考试 <span>${fmtMD(r.p.examStart)}</span></div>` : '';
      note = `<div class="sc-note">${SITE.studyWord(s)} · 距考试开始 ${diffDays(today, r.p.examStart||r.p.studyEnd)} 天</div>`;
      pct = 97;
    } else if(r.kind==='exam'){
      main = `<div class="sc-week" style="font-size:20px;padding-bottom:3px">考试期</div>`;
      metaA = `<div>区间 <span>${fmtMDshort(r.p.examStart)} – ${fmtMDshort(r.p.examEnd)}</span></div>`;
      metaB = `<div>结束 <span>${fmtMD(r.p.examEnd)}</span></div>`;
      note = `<div class="sc-note">${SITE.examNote(diffDays(today, r.p.examEnd))}</div>`;
      pct = 100;
    } else if(r.kind==='orientation'){
      main = `<div class="sc-week" style="font-size:21px;padding-bottom:3px">${SITE.orientationLabel}</div>`;
      metaA = `<div>开学 <span>${fmtMD(r.p.start)}</span></div>`;
      metaB = r.p.teachEnd ? `<div>教学结束 <span>${fmtMD(r.p.teachEnd)}</span></div>` : '';
      note = `<div class="sc-note">迎新周 · 距正式开学 ${diffDays(today, r.p.start)} 天</div>`;
      pct = 0;
    } else if(r.kind==='before'){
      const np = r.p;
      const d = diffDays(today, np.oStart||np.start);
      main = `<div class="sc-week" style="font-size:18px;padding-bottom:4px">假期中</div>`;
      metaA = `<div>下个学期 <span>${np.name}</span></div>`;
      metaB = `<div>开学 <span>${fmtMD(np.start)}</span></div>`;
      note = `<div class="sc-note">距${np.oStart?'迎新周':'开学'}还有 ${d} 天</div>`;
      pct = 0;
    } else if(r.kind==='after'){
      const np = nextPeriod(s, today);
      main = `<div class="sc-week" style="font-size:18px;padding-bottom:4px">已结课</div>`;
      metaA = `<div>${r.p.name} 教学已结束</div>`;
      metaB = np ? `<div>下个学期 <span>${fmtMD(np.start)}</span></div>` : '';
      note = np ? `<div class="sc-note">${np.name} 于 ${fmtMD(np.start)} 开学，还有 ${diffDays(today, np.start)} 天</div>`
                : `<div class="sc-note">${SITE.afterNoNext}</div>`;
      pct = 100;
    } else if(r.kind==='holiday'){
      main = `<div class="sc-week" style="font-size:18px;padding-bottom:4px">假期中</div>`;
      note = `<div class="sc-note">当前日期不在 ${r.p.name} 的教学区间内</div>`;
    } else {
      main = `<div class="sc-week" style="font-size:18px;padding-bottom:4px">无校历数据</div>`;
      note = `<div class="sc-note">该学校暂未收录对应年份的校历</div>`;
    }

    return `<div class="sc" style="--c:${s.color||'#0f62fe'}">
      <div class="sc-bar"></div>
      <div class="sc-body">
        <div class="sc-top">
          <div>
            <div class="sc-code">${s.code}</div>
            <div class="sc-zh">${s.zh||''}</div>
            <div class="sc-city">${s.city ? SITE.country + '·' + s.city : ''}</div>
          </div>
          <div style="text-align:right"><span class="pill ${cls}">${label}</span><div style="margin-top:6px">${ref}</div></div>
        </div>
        <div class="sc-main">${main}<div class="sc-tz" title="该校所在时区当前与北京时间的时差">${tzLabel(tzDiffNow(s.tz))}</div></div>
        <div class="sc-term">${r.p ? r.p.name : '—'} · ${r.p ? fmtMD(r.p.start)+' 开学' : ''}</div>
        ${note}
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta">${metaA}${metaB}${r.p?keyDateCells(r.p, today):''}</div>
        ${r.p ? summaryTable(s, r.p, today) : ''}
        <div class="sc-foot">
          ${s.src ? `<a href="${s.src}" target="_blank" rel="noopener">官方校历</a>` : `<span></span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- clocks ---------- */
function tick(){
  const now = new Date();
  const bp = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(now);
  const bg = t=>bp.find(x=>x.type===t).value;
  const bhh = bg('hour')==='24'?'00':bg('hour');
  document.getElementById('bjTime').innerHTML = `${bhh}:${bg('minute')}<span class="sec">:${bg('second')}</span>`;
  const bjD = D(`${bg('year')}-${bg('month')}-${bg('day')}`);
  document.getElementById('bjDate').textContent = `${bg('year')}年${+bg('month')}月${+bg('day')}日 ${WEEK_CN[bjD.getUTCDay()]}`;
  document.getElementById('stampNow').textContent = `本地更新 ${bg('year')}-${bg('month')}-${bg('day')} ${bhh}:${bg('minute')}:${bg('second')}`;
}

/* ---------- 搜索交互 ---------- */
const qInput = document.getElementById('qSchool');
const sbDropEl = document.getElementById('sbDrop');
qInput.oninput = ()=>{ dropIdx=-1; renderDrop(); };
qInput.onfocus = ()=>{ renderDrop(); };
qInput.onblur  = ()=>{ setTimeout(()=>{ sbDropEl.hidden=true; },120); };
qInput.onkeydown = (ev)=>{
  const ms = matchSchools(qInput.value);
  if(ev.key==='ArrowDown'){ if(!ms.length) return; dropIdx=Math.min(dropIdx+1, ms.length-1); renderDrop(); ev.preventDefault(); }
  else if(ev.key==='ArrowUp'){ if(!ms.length) return; dropIdx=Math.max(dropIdx-1,0); renderDrop(); ev.preventDefault(); }
  else if(ev.key==='Enter'){ const s=ms[dropIdx>=0?dropIdx:0]; if(s) selectSchool(keyOf(s)); ev.preventDefault(); }
  else if(ev.key==='Escape'){ sbDropEl.hidden=true; }
};
document.getElementById('btnSearch').onclick = ()=>{
  const raw = qInput.value.trim();
  const s = matchSchools(raw)[0] || findSchool(raw)
         || allSchools().find(x=>String(x.code).toLowerCase()===raw.toLowerCase());
  if(s) selectSchool(keyOf(s));
  else {
    const msg=document.getElementById('sbMsg');
    msg.style.color='var(--red)';
    msg.textContent='未找到匹配学校，请换关键词（支持简称 / 中文名 / 城市）。';
  }
};
document.getElementById('btnClearSearch').onclick = clearFocus;

/* ============================================================
   6. 视图启动（部署版：澳洲 / 英国各为一个独立页面，用原生链接导航）
   ============================================================ */
function applySite(key){
  SITE = SITES[key];
  document.getElementById('calTitle').textContent = SITE.name;
  document.getElementById('calStamp').textContent = SITE.stamp;
  document.getElementById('qSchool').placeholder = SITE.placeholder;
  document.getElementById('footNotes').innerHTML = SITE.footNotes.map(t=>`<p>${t}</p>`).join('');
  document.getElementById('footLinks').innerHTML =
    SITE.links.map(([h,c])=>`<a href="${h}" target="_blank" rel="noopener">${c}</a>`).join(' · ');

  focusKey = null;
  try{ focusKey = localStorage.getItem(SITE.lsKey) || null; }catch(e){ focusKey=null; }
  if(focusKey && !findSchool(focusKey)) focusKey = null;
  const msg = document.getElementById('sbMsg');
  msg.style.color = 'var(--muted)';
  sbDropEl.hidden = true;
  if(focusKey){
    const s = findSchool(focusKey);
    qInput.value = s.code + (s.zh?' '+s.zh:'');
    document.getElementById('sbTag').textContent = `单独显示 ${s.code}`;
    msg.textContent = `已单独显示 ${s.code}${s.zh?'（'+s.zh+'）':''} 的校历信息；点「显示全部」可恢复。`;
  } else {
    qInput.value = '';
    document.getElementById('sbTag').textContent = '输入简称 / 中文名 / 城市 / 国家';
    msg.textContent = '确认后，下方「当前教学周」只单独显示该学校的校历信息。';
  }
  document.title = SITE.name + ' · 稿多多';
  renderSchools();
  tick();
}

const SITE_KEY = (document.body.getAttribute('data-site') in SITES)
  ? document.body.getAttribute('data-site') : 'au';
document.getElementById('viewCal').hidden = false;
applySite(SITE_KEY);
tick();
setInterval(tick, 1000);
setInterval(()=>{ renderSchools(); }, 60000);
</script>
</body>
</html>
