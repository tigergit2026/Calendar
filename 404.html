<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 稿多多校历查询</title>
<meta name="description" content="页面不存在，返回稿多多校历查询入口。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='6' width='26' height='23' rx='4' fill='%230f62fe'/><rect x='3' y='6' width='26' height='8' rx='4' fill='%23000000' opacity='.22'/><rect x='8' y='17' width='4' height='4' rx='1' fill='%23fff'/><rect x='14' y='17' width='4' height='4' rx='1' fill='%23fff'/><rect x='20' y='17' width='4' height='4' rx='1' fill='%23fff'/><rect x='8' y='23' width='4' height='4' rx='1' fill='%23fff'/><rect x='14' y='23' width='4' height='4' rx='1' fill='%23fff'/></svg>">
<style>

:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --line:#e4e7ec;
  --line-soft:#eef1f5;
  --text:#1a1f26;
  --muted:#6b7480;
  --faint:#9aa3af;
  --accent:#0f62fe;
  --accent-soft:#eaf1ff;
  --green:#0f8a4f;
  --green-soft:#e7f6ee;
  --amber:#b45309;
  --amber-soft:#fdf1e0;
  --red:#c0392b;
  --red-soft:#fdeceb;
  --violet:#6d28d9;
  --violet-soft:#f1ebfd;
  --slate:#475569;
  --slate-soft:#eef1f5;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 72px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.2px}
.top .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.stamp{font-size:12px;color:var(--faint);text-align:right;line-height:1.7}
.stamp b{color:var(--muted);font-weight:600}

/* ---------- section ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:15px;font-weight:640}
.sec-h .tag{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:#fff}
.sec-h .line{flex:1;height:1px;background:var(--line)}

/* ---------- row 1: Beijing ---------- */
.beijing{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.bj-left{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.bj-time{font-size:52px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.bj-time .sec{font-size:24px;color:var(--faint);margin-left:2px}
.bj-date .d{font-size:19px;font-weight:600}
.bj-date .m{font-size:13px;color:var(--muted);margin-top:3px}
.bj-right{display:flex;gap:26px;flex-wrap:wrap}
.kv{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:17px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

/* ---------- search ---------- */
.searchbar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.sb-field{position:relative;flex:1;min-width:240px}
.sb-field input{
  font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);width:100%;
}
.sb-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sb-drop{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 28px rgba(16,24,40,.12);max-height:290px;overflow-y:auto;
}
.sb-item{padding:9px 12px;display:flex;align-items:baseline;gap:8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-soft)}
.sb-item:last-child{border-bottom:none}
.sb-item:hover,.sb-item.act{background:var(--accent-soft)}
.sb-item b{font-weight:680}
.sb-item i{font-style:normal;color:var(--muted);font-size:12.5px}
.sb-item s{text-decoration:none;color:var(--faint);font-size:11px;margin-left:auto}
.sb-msg{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- school cards ---------- */
.schools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.schools.single{grid-template-columns:1fr;max-width:820px;margin:0 auto}
.sc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.03);display:flex;flex-direction:column;
}
.sc-bar{height:3px;background:var(--c,#0f62fe)}
.sc-body{padding:15px 17px 16px;flex:1;display:flex;flex-direction:column}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sc-code{font-size:22.5px;font-weight:680;letter-spacing:.3px;line-height:1.15}
.sc-zh{font-size:18px;color:var(--muted);margin-top:2px}
.sc-city{font-size:11.5px;color:var(--faint);margin-top:4px;letter-spacing:.2px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-teaching{background:var(--green-soft);color:var(--green)}
.p-break{background:var(--amber-soft);color:var(--amber)}
.p-exam{background:var(--red-soft);color:var(--red)}
.p-study{background:var(--violet-soft);color:var(--violet)}
.p-rest{background:var(--slate-soft);color:var(--slate)}

.sc-main{display:flex;align-items:flex-end;gap:9px;margin:12px 0 2px}
.sc-week{font-size:28px;font-weight:700;line-height:1;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.sc-week small{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:4px}
.sc-of{font-size:11.5px;font-weight:600;color:var(--faint);padding-bottom:4px}
.sc-tz{
  margin-left:auto;align-self:flex-end;margin-bottom:4px;white-space:nowrap;
  font-size:11px;font-weight:640;color:var(--slate);background:var(--line-soft);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;
}
.sc-tz b{font-weight:700;color:var(--accent)}
.sc-term{font-size:11.5px;color:var(--muted);margin-top:2px}
.sc-note{font-size:12px;margin-top:8px;padding:6px 9px;border-radius:8px;background:var(--line-soft);color:var(--slate);line-height:1.5}

.bar{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:13px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--c,#0f62fe)}

.meta{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.meta div{font-size:11.5px;color:var(--muted)}
.meta div span{color:var(--text);font-weight:560}
.meta .kd em{font-style:normal;font-size:10.5px;color:var(--faint);margin-left:2px}
.meta .kd em.now{color:var(--amber);font-weight:700}

/* ---------- 学期时间汇总表 ---------- */
.sc-sum{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sc-sum-h{font-size:12.5px;font-weight:680;text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);color:var(--text);letter-spacing:.3px}
.sc-sum table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.sc-sum td{border-top:1px solid var(--line-soft);padding:3.5px 6px;text-align:center;color:var(--slate);line-height:1.4}
.sc-sum tr:first-child td{border-top:none}
.sc-sum .sg{width:27%;background:#f9e4e2;color:#93413a;font-weight:640}
.sc-sum .sw{width:31%;font-weight:620;color:var(--text)}
.sc-sum tr.r-break td{background:#fdf4da}
.sc-sum tr.r-break .sw{color:#8a6116}
.sc-sum tr.r-study td{background:var(--violet-soft)}
.sc-sum tr.r-exam td{background:var(--green-soft)}
.sc-sum tr.r-extra td{background:#fbfcfd}
.sc-sum tr.r-extra .sg{background:transparent;color:var(--muted)}
.sc-sum tr.r-extra .sw{color:var(--slate);font-weight:700}
.sc-sum .cnt{font-style:normal;font-size:10px;color:var(--faint);margin-left:4px}
.sc-sum .cnt.now{color:var(--amber);font-weight:700}
.sc-sum tr.cur td{box-shadow:inset 0 0 0 2px #0f62fe;font-weight:700}
.sc-sum tr.cur .sg{box-shadow:none}
.sc-foot{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sc-foot a{font-size:11px;color:var(--faint);text-decoration:none}
.sc-foot a:hover{color:var(--accent)}
.ref{font-size:10px;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 6px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--faint);background:#fbfcfd;font-size:13px}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:13px;font-weight:560;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;
}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:#cbd2dc}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.8}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}

@media (max-width:1080px){
  .schools{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .wrap{padding:18px 14px 56px}
  .schools{grid-template-columns:1fr}
  .bj-time{font-size:40px}
  .sc-code{font-size:19px}
  .sc-zh{font-size:15px}
}


/* ---------- 第 1 层：入口页 ---------- */
body.on-home{display:flex;flex-direction:column;justify-content:center;min-height:100vh;background:
  radial-gradient(1200px 520px at 50% -10%, #eaf1ff 0%, rgba(234,241,255,0) 62%), var(--bg)}
.home{width:100%;max-width:980px;margin:0 auto;padding:46px 24px 52px;text-align:center}
.home-badge{
  display:inline-block;font-size:11.5px;font-weight:640;letter-spacing:1.4px;color:var(--accent);
  background:var(--accent-soft);border:1px solid #d8e5ff;border-radius:999px;padding:4px 14px;
}
.home-title{margin:20px 0 0;font-size:44px;font-weight:700;letter-spacing:3px;line-height:1.2}
.home-sub{margin:14px 0 0;font-size:13.5px;color:var(--muted);line-height:1.8}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:42px;text-align:left}
.home-card{
  position:relative;overflow:hidden;font:inherit;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px 22px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.home-card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.home-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(16,24,40,.10);border-color:#ccd4e0}
.home-card:active{transform:translateY(-1px)}
.home-card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.hc-flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;color:#fff;background:var(--c);border-radius:999px;padding:3px 11px}
.hc-title{margin:15px 0 0;font-size:23px;font-weight:700;letter-spacing:.4px;color:var(--text)}
.hc-desc{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.hc-meta{margin-top:15px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.hc-go{color:var(--c);font-weight:700}
.home-foot{margin-top:38px;font-size:11.5px;color:var(--faint);line-height:1.9}

/* ---------- 第 2 层：返回入口 ---------- */
.back{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;padding:6px 15px;margin-bottom:14px;
}
.back:hover{color:var(--accent);border-color:#cbd2dc}
#footNotes p{margin:0 0 6px}
#footNotes p:last-child{margin-bottom:0}

/* 四张卡片：宽屏 2×2，窄屏单列 */
@media (max-width:860px){
  .home{padding:34px 18px 44px;max-width:100%}
  .home-title{font-size:31px;letter-spacing:1px}
  .home-grid{grid-template-columns:1fr;gap:16px;margin-top:30px}
  .hc-title{font-size:20px}
}

/* ---------- 部署版：入口卡片与返回按钮改用链接 ---------- */
a.home-card{color:inherit;text-decoration:none}
a.back{display:inline-block;text-decoration:none;line-height:1.45}
</style>
</head>
<body class="on-home">
<section class="home">
  <span class="home-badge">稿多多 · 留学日历</span>
  <h1 class="home-title">页面不存在</h1>
  <p class="home-sub">该地址没有对应页面，3 秒后自动返回入口。</p>
  <p class="home-foot"><a href="index.html" style="color:var(--accent);font-weight:600;text-decoration:none">立即返回入口 →</a></p>
</section>
<script>setTimeout(function(){ location.replace('index.html'); }, 3000);</script>
</body>
</html>
